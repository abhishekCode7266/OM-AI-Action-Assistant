<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="om-logo-svg">
  <defs>
    <!-- Core Brand Gradients -->
    <linearGradient id="omPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="omNeonGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="omSubtleGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Glow Filter for Futuristic Bloom -->
    <filter id="omGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Shield / Hex Rounded Base (Dark Obsidian) -->
  <rect x="12" y="12" width="216" height="216" rx="44" fill="#0A0F1D" stroke="url(#omPrimaryGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Futuristic Geometric 'O' (Left Neural Orbital Loop) -->
  <g filter="url(#omGlow)">
    <circle cx="82" cy="120" r="46" stroke="url(#omPrimaryGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="210 30" fill="none"/>
    <!-- Inner Core Dot -->
    <circle cx="82" cy="120" r="8" fill="#38BDF8" />
  </g>

  <!-- Futuristic Geometric 'M' (Right Interconnected Dual Chevron Action Peak) -->
  <g filter="url(#omGlow)">
    <path d="M 124 162 L 124 78 L 154 124 L 184 78 L 184 162" 
          stroke="url(#omNeonGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <!-- Momentum Vector Accent at Apexes -->
    <circle cx="124" cy="78" r="4" fill="#67E8F9"/>
    <circle cx="154" cy="124" r="5" fill="#A78BFA"/>
    <circle cx="184" cy="78" r="4" fill="#38BDF8"/>
  </g>

  <!-- Interconnecting Synaptic Bridge linking O and M -->
  <line x1="105" y1="120" x2="124" y2="120" stroke="url(#omSubtleGlow)" stroke-width="4" stroke-dasharray="2 3"/>
</svg>
